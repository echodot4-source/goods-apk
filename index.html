<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج استلام بضاعة</title>
  <meta name="theme-color" content="#b91c1c">
  <link rel="manifest" href="manifest.webmanifest">
  <style>body{font-family:sans-serif;padding:20px}input,button{padding:10px;margin:5px}#qr-reader{width:100%;max-width:420px;margin-top:10px}</style>
</head>
<body>
  <h1>نموذج استلام بضاعة</h1>
  <label>رمز المادة</label>
  <input id="itemCode" type="text">
  <button id="qr-toggle">📷 تشغيل الماسح</button>
  <div id="qr-reader" style="display:none;"></div>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script>
    let qr=null, scanning=false;
    async function startQr(){
      try{
        if(!qr) qr=new Html5Qrcode("qr-reader");
        document.getElementById("qr-reader").style.display="block";
        await qr.start({facingMode:"environment"},{fps:10,qrbox:250},(txt)=>{
          document.getElementById("itemCode").value=txt; stopQr();
        });
        scanning=true; document.getElementById("qr-toggle").textContent="⏹️ إيقاف الماسح";
      }catch(e){ alert("تأكد من إذن الكاميرا وHTTPS"); stopQr(true); }
    }
    async function stopQr(hide){
      try{ if(qr && scanning) await qr.stop(); }catch(e){}
      try{ if(qr) await qr.clear(); }catch(e){}
      scanning=false; document.getElementById("qr-toggle").textContent="📷 تشغيل الماسح";
      if(!hide) document.getElementById("qr-reader").style.display="none";
    }
    document.getElementById("qr-toggle").onclick=()=> scanning?stopQr():startQr();
    if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js")); }
  </script>
</body>
</html>
